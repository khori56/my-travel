<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#0877e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Travel">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">

  <title>My Travel</title>
</head>

<body>

<header>
  <small>PERSONAL TRAVEL ORGANIZER</small>
  <h1>My Travel</h1>
</header>

<main id="app"></main>

<nav>
  <button data-tab="trips">
    ✈️
    <span>Trips</span>
  </button>

  <button data-tab="today">
    ☀️
    <span>Today</span>
  </button>

  <button data-tab="days">
    📅
    <span>Days</span>
  </button>

  <button data-tab="backup">
    ⬆️
    <span>Backup</span>
  </button>
</nav>

<input
  id="restore"
  type="file"
  accept=".json"
  hidden
>

<script src="app.js"></script>

</body>
</html>
